[package]
name = "mms-git"
version = "0.1.0"
edition = "2021"
description = "Git repository information and operations for MMS agent"
license = "MIT"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["process", "time"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
