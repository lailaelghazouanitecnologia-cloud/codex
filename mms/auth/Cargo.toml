[package]
name = "mms-auth"
version = "0.1.0"
edition = "2021"
description = "Authentication management for MMS agent"
license = "MIT"

[dependencies]
mms-common = { path = "../common" }

# Async runtime
tokio = { workspace = true, features = ["sync", "time", "fs"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# HTTP client for token refresh
reqwest = { version = "0.12", features = ["json"] }

# JWT parsing
base64 = "0.22"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Hashing for keyring keys
sha2 = "0.10"

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Optional keyring support
keyring = { version = "3", optional = true }

[features]
default = []
keyring = ["dep:keyring"]
