# MMS Execution Policy Example
#
# This file defines which commands are allowed, require prompt, or are forbidden.
#
# Decision types:
# - allow: Execute without asking
# - prompt: Ask user for approval before executing
# - forbidden: Never execute

[policy]
# Default decision for commands that don't match any rule
# Options: allow, prompt, forbidden
default = "prompt"

# Optional metadata
name = "Default Development Policy"
description = "Safe defaults for development environments"

# Rule Types:
# - prefix: Match command prefix (e.g., "git status" matches "git status -s")
# - exact: Match exact command (e.g., "echo hello" only matches "echo hello")
# - glob: Match any command starting with program name

# =============================================================================
# ALLOWED COMMANDS
# =============================================================================

# File listing and viewing
[[rules]]
type = "glob"
program = "ls"
decision = "allow"

[[rules]]
type = "glob"
program = "cat"
decision = "allow"

[[rules]]
type = "glob"
program = "head"
decision = "allow"

[[rules]]
type = "glob"
program = "tail"
decision = "allow"

[[rules]]
type = "glob"
program = "less"
decision = "allow"

# Search tools
[[rules]]
