# =============================================================================
# FORBIDDEN COMMANDS
# =============================================================================

# Destructive file operations
[[rules]]
type = "prefix"
command = ["rm", "-rf", "/"]
decision = "forbidden"
description = "Never allow rm -rf /"

[[rules]]
type = "prefix"
command = ["rm", "-rf", "/*"]
decision = "forbidden"

